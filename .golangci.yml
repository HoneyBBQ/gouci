version: "2"

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/honeybbq/gouci)

linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
    - tagliatelle
    - testpackage
    - ireturn
    - containedctx
    - gochecknoglobals
    - paralleltest
    - tparallel
    - mnd
    - goconst
    - gomodguard
    - embeddedstructfieldcheck

  settings:
    govet:
      enable-all: true
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
    decorder:
      dec-order:
        - const
        - var
        - type
        - func
      disable-dec-order-check: false
      disable-init-func-first-check: false
      disable-dec-num-check: true
    funcorder:
      constructor: true
      struct-method: true
    cyclop:
      max-complexity: 15
    gocyclo:
      min-complexity: 15
    funlen:
      lines: 60
      statements: 30

  exclusions:
    rules:
      # Internal package helpers are implementation details of this module.
      - path: ^internal/
        linters:
          - revive
        text: exported|package-comments
      # Test fixtures use fake values, casts, and temp directories.
      - path: .*_test\.go
        linters:
          - gosec
        text: G101|G115|G304|G404

run:
  timeout: 10m
  go: '1.27'
  tests: true
  build-tags:
    - integration
